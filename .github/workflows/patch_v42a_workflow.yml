name: Generate Dashboard v42a

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_v42a.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Esegui patch_v42a.py
        run: python -u patch_v42a.py 2>&1

      - name: Verifica file generato
        run: |
          ls -lh Dashboard_pro_V_42a.py
          echo "Righe v42a: $(wc -l < Dashboard_pro_V_42a.py)"
          echo "Chars v42a: $(wc -c < Dashboard_pro_V_42a.py)"

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add Dashboard_pro_V_42a.py
          git diff-index --quiet HEAD || git commit -m "build: Dashboard_pro_V_42a.py auto-generato [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

