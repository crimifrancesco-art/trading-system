name: Generate Dashboard v41d

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_v41d.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true    # ← aggiunge questa riga

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui patch_v41d.py
        run: python patch_v41d.py

      - name: Commit e push Dashboard_pro_V_41d.py
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add Dashboard_pro_V_41d.py
          git diff-index --quiet HEAD || git commit -m "🚀 Genera Dashboard_pro_V_41d.py [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
