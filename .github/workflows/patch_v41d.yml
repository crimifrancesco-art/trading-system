name: Generate Dashboard v41d

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_v41d.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5          # ← Node.js 24 nativo

      - name: Setup Python 3.11
        uses: actions/setup-python@v6      # ← Node.js 24 nativo
        with:
          python-version: '3.11'

      - name: Esegui patch_v41d.py
        run: |
          python -u patch_v41d.py 2>&1
          echo "Exit code: $?"

      - name: Commit e push Dashboard_pro_V_41d.py
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add Dashboard_pro_V_41d.py
          git diff-index --quiet HEAD || git commit -m "🚀 Genera Dashboard_pro_V_41d.py [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
