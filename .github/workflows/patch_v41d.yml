name: Generate Dashboard v41d

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_v41d.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← opt-in Node.js 24 subito

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2          # ← aggiornato

      - name: Setup Python
        uses: actions/setup-python@v5.6.0      # ← aggiornato

      - name: Esegui patch_v41d.py
        run: python patch_v41d.py

      - name: Commit e push Dashboard_pro_V_41d.py
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add Dashboard_pro_V_41d.py
          git diff-index --quiet HEAD || git commit -m "🚀 Genera Dashboard_pro_V_41d.py"
          git push
