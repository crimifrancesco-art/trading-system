name: Generate Dashboard v41h

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_v41d.py'
      - 'patch_v41e.py'
      - 'patch_v41f.py'
      - 'patch_v41g.py'
      - 'patch_v41h.py'
      - 'patch_home_v322.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Esegui patch_v41d.py
        run: python -u patch_v41d.py 2>&1

      - name: Esegui patch_v41e.py
        run: python -u patch_v41e.py 2>&1

      - name: Esegui patch_v41f.py
        run: python -u patch_v41f.py 2>&1

      - name: Esegui patch_v41g.py
        run: python -u patch_v41g.py 2>&1

      - name: Esegui patch_v41h.py
        run: python -u patch_v41h.py 2>&1

      - name: Verifica file generati
        run: |
          ls -lh Dashboard_pro_V_41d.py Dashboard_pro_V_41e.py Dashboard_pro_V_41f.py Dashboard_pro_V_41g.py Dashboard_pro_V_41h.py
          echo "Righe v41h: $(wc -l < Dashboard_pro_V_41h.py)"

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add Dashboard_pro_V_41d.py Dashboard_pro_V_41e.py Dashboard_pro_V_41f.py Dashboard_pro_V_41g.py Dashboard_pro_V_41h.py utils/home_tab.py
          git diff-index --quiet HEAD || git commit -m "build: Dashboard_pro_V_41h.py auto-generato [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

