name: Generate Dashboard v42e

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patch_v42e.py'
      - 'Dashboard_pro_V_41c.py'
      - 'Dashboard_pro_V_41e.py'

permissions:
  contents: write

concurrency:
  group: patch-v42e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Debug workspace
        run: |
          echo "REF=${GITHUB_REF}"
          echo "SHA=${GITHUB_SHA}"
          pwd
          ls -lah
          echo "--- .github/workflows ---"
          ls -lah .github/workflows || true
          echo "--- input files ---"
          ls -lah Dashboard_pro_V_41c.py Dashboard_pro_V_41e.py patch_v42e.py || true

      - name: Verify inputs
        run: |
          test -f patch_v42e.py
          if [ -f Dashboard_pro_V_41e.py ]; then
            echo "Using Dashboard_pro_V_41e.py as base"
          elif [ -f Dashboard_pro_V_41c.py ]; then
            echo "Using Dashboard_pro_V_41c.py as base"
          else
            echo "No valid input dashboard found"
            exit 1
          fi

      - name: Run patch_v42e.py
        run: |
          python -u patch_v42e.py 2>&1
          test -f Dashboard_pro_V_42e.py
          python -m py_compile Dashboard_pro_V_42e.py
          echo "OK: Dashboard_pro_V_42e.py generated"

      - name: Show git status
        run: |
          git status --short
          git diff -- Dashboard_pro_V_42e.py | head -n 200 || true

      - name: Commit generated file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add Dashboard_pro_V_42e.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Generate Dashboard_pro_V_42e.py [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
